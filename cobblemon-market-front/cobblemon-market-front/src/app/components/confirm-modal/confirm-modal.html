@if (open) {
  <div class="confirm-overlay" (mousedown)="onOverlayMouseDown($event)">
    <section class="confirm-card" (mousedown)="$event.stopPropagation()">
      <header class="confirm-header">
        <h3>{{ title }}</h3>
      </header>

      <p class="confirm-message">{{ message }}</p>

      <div class="confirm-actions">
        <button type="button" class="confirm-cancel" (click)="cancelAction.emit()" [disabled]="busy">
          {{ cancelLabel }}
        </button>
        <button
          type="button"
          class="confirm-submit"
          [class.is-danger]="danger"
          (click)="confirmAction.emit()"
          [disabled]="busy">
          {{ confirmLabel }}
        </button>
      </div>
    </section>
  </div>
}
